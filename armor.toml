# FerrisRes Armor Configuration
# Enable/disable security layers and customize thresholds

# Layer enables
[l0]
enabled = true  # L0: regex + bloom filters

[l1]
enabled = false  # L1: neural scanner. Requires trained weights; enabling it
                 # without [armor] l1_weights refuses startup.
threshold = 0.7  # injection score threshold

[l2] 
enabled = true  # L2: representation probe
threshold = 0.7

[l3]
enabled = true  # L3: PII redaction

[armor]
# Path to trained L1 weights (FRAL). Produced by the bootstrap trainer in
# src/training/armor_trainer.rs. Empty keeps L1 off. The file format and the
# enable gate are specified in docs/tasks/armor-l1-enablement.md on the
# docs/armor-l1 branch.
l1_weights = ""

# Self-learning feedback
[feedback]
max_history = 1000

# Custom patterns (regex for L0)
[custom_patterns]
# Add domain-specific blocked patterns here
blocked = []
