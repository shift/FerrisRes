[package]
name = "ferrisres"
version = "0.2.3"
edition = "2021"
description = "Block AttnRes runtime for distributed SLM/LLM training and inference"
license = "AGPL-3.0-or-later"
authors = ["FerrisRes Team"]
repository = "https://github.com/shift/FerrisRes"
rust-version = "1.75"

[dependencies]
wgpu = "29"
naga = "29"
bytemuck = "1.15"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmi = "0.40"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1"
anyhow = "1"
ash = "0.38"
clap = { version = "4", features = ["derive"] }
sysinfo = "0.33"
image = "0.25"
rand = "0.8"
pollster = "0.3"
memmap2 = "0.9"
half = { version = "2", features = ["num-traits", "serde", "bytemuck"] }
rayon = "1.10"
ureq = { version = "2", features = ["json"] }
matrixmultiply = "0.3"
regex = "1"
tokenizers = "0.21"

[dev-dependencies]
assert_matches = "1"
criterion = { version = "0.5", features = ["async_tokio"] }
proptest = "1"

[features]
default = ["vulkan"]
vulkan = ["wgpu/vulkan"]
metal = ["wgpu/metal"]
dx12 = ["wgpu/dx12"]
webgpu = ["wgpu/webgpu"]
integrated_gpu_profile = []
high_end_profile = []

[lints.clippy]
approx_constant = "allow"
assertions_on_constants = "allow"
clone_on_copy = "allow"
collapsible_if = "allow"
collapsible_match = "allow"
doc_lazy_continuation = "allow"
doc_overindented_list_items = "allow"
empty_line_after_doc_comments = "allow"
empty_line_after_outer_attr = "allow"
eq_op = "allow"
erasing_op = "allow"
excessive_precision = "allow"
field_reassign_with_default = "allow"
for_kv_map = "allow"
identity_op = "allow"
if_same_then_else = "allow"
items_after_test_module = "allow"
iter_cloned_collect = "allow"
large_enum_variant = "allow"
len_without_is_empty = "allow"
len_zero = "allow"
let_and_return = "allow"
manual_clamp = "allow"
manual_div_ceil = "allow"
manual_flatten = "allow"
manual_memcpy = "allow"
manual_range_contains = "allow"
manual_slice_size_calculation = "allow"
manual_strip = "allow"
missing_const_for_thread_local = "allow"
module_inception = "allow"
needless_bool = "allow"
needless_borrow = "allow"
needless_borrowed_reference = "allow"
needless_borrows_for_generic_args = "allow"
needless_range_loop = "allow"
needless_update = "allow"
new_without_default = "allow"
option_as_ref_deref = "allow"
ptr_arg = "allow"
redundant_closure = "allow"
redundant_guards = "allow"
should_implement_trait = "allow"
single_match = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
unnecessary_cast = "allow"
unnecessary_filter_map = "allow"
unnecessary_map_or = "allow"
unnecessary_min_or_max = "allow"
unnecessary_unwrap = "allow"
unused_enumerate_index = "allow"
useless_format = "allow"
useless_vec = "allow"
vec_init_then_push = "allow"

[build-dependencies]
naga = "29"

[[example]]
name = "compute_example"
path = "examples/compute_example.rs"

[[example]]
name = "example_impl"
path = "examples/example_impl.rs"

[[bin]]
name = "ferrisres"
path = "src/main.rs"

[[bench]]
name = "benchmark"
harness = false

[[bench]]
name = "turboquant_benchmarks"
path = "benches/turboquant_benchmarks.rs"

[[bench]]
name = "sparse_ternary_bench"
harness = false
path = "benches/sparse_ternary_bench.rs"

[[bench]]
name = "ternary_bench"
harness = false
path = "benches/ternary_bench.rs"
